<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DENZZAPP</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0d0d0d;
    color:white;
}

.header{
    background:#111;
    padding:20px;
    text-align:center;
    border-bottom:2px solid #00ff66;
}

.logo{
    font-size:32px;
    font-weight:bold;
    color:#00ff66;
}

.banner{
    margin:20px;
    padding:30px;
    text-align:center;
    border:2px solid #00ff66;
    border-radius:15px;
    background:rgba(0,255,102,0.08);
}

.banner h1{
    color:#00ff66;
    margin:0;
}

.banner p{
    color:#9affc5;
}

.card{
    margin:20px;
    padding:20px;
    border:2px solid #00ff66;
    border-radius:15px;
    background:#141414;
}

.input-box{
    width:100%;
    padding:12px;
    border:1px solid #00ff66;
    border-radius:10px;
    background:#0f0f0f;
    color:white;
    box-sizing:border-box;
}

.btn{
    margin-top:15px;
    width:100%;
    padding:12px;
    background:#00cc55;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.btn:hover{
    background:#00ff66;
    color:black;
}
</style>
</head>
<body>

<div class="header">
    <div class="logo">DENZZAPP</div>
</div>

<div class="banner">
    <h1>DENZZAPP</h1>
    <p>Custom Green Theme Interface</p>
</div>

<div class="card">
    <h3>Target Number</h3>
    <input type="text" class="input-box" placeholder="Masukkan nomor">
    <button class="btn">Kirim</button>
</div>

</body>
</html>
